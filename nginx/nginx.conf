worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    gzip            on;
    gzip_min_length 1k;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

    # Backend API
    upstream backend {
        server backend:3000;
    }

    # ============================================
    # Single-server deployment (IP-based, path routing)
    # Access:
    #   http://<IP>/                  -> landing page
    #   http://<IP>/customer/         -> customer-web (H5)
    #   http://<IP>/group/            -> group-admin
    #   http://<IP>/mall/             -> mall-admin
    #   http://<IP>/merchant/         -> merchant-portal
    #   http://<IP>/api/              -> backend API
    #   http://<IP>/api/docs          -> Swagger docs
    # ============================================
    server {
        listen 80 default_server;
        server_name _;
        charset utf-8;

        # ---------- Landing page ----------
        location = / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link REIT Membership System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
.container{text-align:center;max-width:600px;padding:40px}
h1{font-size:2rem;margin-bottom:8px}
.sub{opacity:.8;margin-bottom:40px;font-size:1.1rem}
.links{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a{display:block;padding:20px;background:rgba(255,255,255,.15);border-radius:12px;color:#fff;text-decoration:none;backdrop-filter:blur(10px);transition:all .2s}
a:hover{background:rgba(255,255,255,.25);transform:translateY(-2px)}
.label{font-size:1.1rem;font-weight:600}
.desc{font-size:.85rem;opacity:.7;margin-top:4px}
.api-link{grid-column:1/-1}
</style>
</head>
<body>
<div class="container">
<h1>Link REIT Membership</h1>
<p class="sub">Member Management System</p>
<div class="links">
<a href="/customer/"><div class="label">Customer H5</div><div class="desc">Customer Web App</div></a>
<a href="/merchant/"><div class="label">Merchant Portal</div><div class="desc">Shop Staff Portal</div></a>
<a href="/mall/"><div class="label">Mall Admin</div><div class="desc">Mall Management</div></a>
<a href="/group/"><div class="label">Group Admin</div><div class="desc">HQ Management</div></a>
<a href="/api/docs" class="api-link"><div class="label">API Docs</div><div class="desc">Swagger Documentation</div></a>
</div>
</div>
</body>
</html>';
        }

        # ---------- Backend API ----------
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://backend/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
        }

        # ---------- Customer Web (H5) ----------
        location /customer/ {
            proxy_pass http://customer-web:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ---------- Group Admin ----------
        location /group/ {
            proxy_pass http://group-admin:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ---------- Mall Admin ----------
        location /mall/ {
            proxy_pass http://mall-admin:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ---------- Merchant Portal ----------
        location /merchant/ {
            proxy_pass http://merchant-portal:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
