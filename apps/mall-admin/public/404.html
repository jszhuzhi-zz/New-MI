<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page App redirect for CloudBase static hosting
    var basePath = '/mall-admin';
    var path = window.location.pathname;
    if (path.startsWith(basePath)) {
      path = path.substring(basePath.length);
    }
    sessionStorage.setItem('redirect_path', path + window.location.search);
    window.location.replace(basePath + '/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
