<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Single Page App redirect for CloudBase static hosting
    // Redirects 404 to index.html with the original path stored in sessionStorage
    sessionStorage.setItem('redirect_path', window.location.pathname + window.location.search);
    window.location.replace('/');
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
