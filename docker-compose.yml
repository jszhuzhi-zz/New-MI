version: '3.8'

services:
  # ============================================
  # Infrastructure
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: link-reit-postgres
    environment:
      POSTGRES_DB: link_reit_membership
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: link-reit-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API
  # ============================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: link-reit-backend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/link_reit_membership
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/app/uploads

  # ============================================
  # Frontend Apps (served via Nginx)
  # ============================================
  customer-web:
    build:
      context: .
      dockerfile: apps/customer-web/Dockerfile
    container_name: link-reit-customer-web
    expose:
      - '80'
    depends_on:
      - backend

  group-admin:
    build:
      context: .
      dockerfile: apps/group-admin/Dockerfile
    container_name: link-reit-group-admin
    expose:
      - '80'
    depends_on:
      - backend

  mall-admin:
    build:
      context: .
      dockerfile: apps/mall-admin/Dockerfile
    container_name: link-reit-mall-admin
    expose:
      - '80'
    depends_on:
      - backend

  merchant-portal:
    build:
      context: .
      dockerfile: apps/merchant-portal/Dockerfile
    container_name: link-reit-merchant-portal
    expose:
      - '80'
    depends_on:
      - backend

  # ============================================
  # Nginx Reverse Proxy (unified entry)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: link-reit-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - customer-web
      - group-admin
      - mall-admin
      - merchant-portal

volumes:
  postgres_data:
  redis_data:
  upload_data:
